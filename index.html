
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money Calculator</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #1f2937;
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 850px;
    margin: 30px auto;
    background: white;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.08);
}

h1 {
    text-align: center;
    color: #4f46e5;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #6b7280;
    margin-bottom: 25px;
}

/* NAME POPUP */

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
}

.popup {
    background: white;
    width: 100%;
    max-width: 420px;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.25);
}

.popup h2 {
    text-align: center;
    color: #4f46e5;
    margin-bottom: 10px;
}

.popup p {
    text-align: center;
    color: #6b7280;
    margin-bottom: 25px;
}

.field {
    margin-bottom: 18px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #4f46e5;
    box-shadow: 0 0 0 3px rgba(79,70,229,0.12);
}

button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #4f46e5;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #4338ca;
}

.error {
    color: #dc2626;
    font-size: 13px;
    margin-top: 10px;
    text-align: center;
}

/* CALCULATOR */

#calculator {
    display: none;
}

.players {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.player-card {
    padding: 20px;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    background: #fafafa;
}

.player-card h2 {
    color: #4f46e5;
    margin-bottom: 20px;
    text-align: center;
}

.result {
    margin-top: 25px;
    padding: 20px;
    background: #eef2ff;
    border-radius: 12px;
}

.result h2 {
    margin-bottom: 15px;
    color: #3730a3;
}

.result p {
    margin: 10px 0;
    font-size: 16px;
}

.profit {
    color: #15803d;
    font-weight: bold;
}

.loss {
    color: #dc2626;
    font-weight: bold;
}

.secondary-btn {
    background: #374151;
}

.secondary-btn:hover {
    background: #1f2937;
}

@media(max-width: 600px) {
    .players {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 20px;
    }
}
</style>
</head>

<body>

<!-- NAME POPUP -->

<div class="overlay" id="namePopup">
    <div class="popup">

        <h2>Welcome!</h2>
        <p>Enter both player names to start the calculator.</p>

        <div class="field">
            <label for="name1">Player 1 Name</label>
            <input type="text" id="name1"
                   placeholder="Enter Player 1 name"
                   maxlength="30">
        </div>

        <div class="field">
            <label for="name2">Player 2 Name</label>
            <input type="text" id="name2"
                   placeholder="Enter Player 2 name"
                   maxlength="30">
        </div>

        <button onclick="startCalculator()">
            Continue to Calculator
        </button>

        <div class="error" id="nameError"></div>

    </div>
</div>

<!-- MAIN CALCULATOR -->

<div class="container" id="calculator">

    <h1>Money Calculator</h1>
    <p class="subtitle">Two Player Profit & Loss Splitter</p>

    <div class="players">

        <!-- PLAYER 1 -->

        <div class="player-card">

            <h2 id="player1Title">Player 1</h2>

            <div class="field">
                <label>Total Amount Invested (₹)</label>
                <input type="number" id="player1Amount"
                       placeholder="Enter amount" min="0">
            </div>

            <div class="field">
                <label>Total Amount Received (₹)</label>
                <input type="number" id="player1Received"
                       placeholder="Enter received amount" min="0">
            </div>

        </div>

        <!-- PLAYER 2 -->

        <div class="player-card">

            <h2 id="player2Title">Player 2</h2>

            <div class="field">
                <label>Total Amount Invested (₹)</label>
                <input type="number" id="player2Amount"
                       placeholder="Enter amount" min="0">
            </div>

            <div class="field">
                <label>Total Amount Received (₹)</label>
                <input type="number" id="player2Received"
                       placeholder="Enter received amount" min="0">
            </div>

        </div>

    </div>

    <button onclick="calculate()">Calculate Profit / Loss</button>

    <button class="secondary-btn" onclick="resetCalculator()">
        Reset Amounts
    </button>

    <button class="secondary-btn" onclick="changePlayers()">
        Change Player Names
    </button>

    <div class="result" id="result" style="display:none;">

        <h2>Calculation Result</h2>

        <p id="totalInvestment"></p>
        <p id="totalReceived"></p>
        <p id="totalProfit"></p>

        <hr style="margin:15px 0; border:0; border-top:1px solid #c7d2fe;">

        <p id="share1"></p>
        <p id="share2"></p>

        <h3 id="settlement" style="margin-top:20px;"></h3>

    </div>

</div>

<script>

// START CALCULATOR AFTER ENTERING NAMES

let player1Name = "";
let player2Name = "";

function startCalculator() {

    const name1 = document.getElementById("name1").value.trim();
    const name2 = document.getElementById("name2").value.trim();

    const error = document.getElementById("nameError");

    if (!name1 || !name2) {
        error.textContent = "Please enter both player names.";
        return;
    }

    if (name1.toLowerCase() === name2.toLowerCase()) {
        error.textContent = "Please enter two different names.";
        return;
    }

    player1Name = name1;
    player2Name = name2;

    document.getElementById("player1Title").textContent = player1Name;
    document.getElementById("player2Title").textContent = player2Name;

    document.getElementById("namePopup").style.display = "none";
    document.getElementById("calculator").style.display = "block";

    document.getElementById("result").style.display = "none";
}

// FORMAT INDIAN RUPEES

function money(amount) {
    return amount.toLocaleString("en-IN", {
        style: "currency",
        currency: "INR",
        maximumFractionDigits: 2
    });
}

// CALCULATE PROFIT / LOSS

function calculate() {

    const p1Amount = Number(document.getElementById("player1Amount").value);
    const p1Received = Number(document.getElementById("player1Received").value);

    const p2Amount = Number(document.getElementById("player2Amount").value);
    const p2Received = Number(document.getElementById("player2Received").value);

    const inputs = [
        "player1Amount",
        "player1Received",
        "player2Amount",
        "player2Received"
    ];

    for (let id of inputs) {

        const value = document.getElementById(id).value;

        if (value === "" || !Number.isFinite(Number(value)) || Number(value) < 0) {
            alert("Please enter valid non-negative amounts in all fields.");
            return;
        }
    }

    const totalInvestment = p1Amount + p2Amount;
    const totalReceived = p1Received + p2Received;

    const profit = totalReceived - totalInvestment;
    const eachShare = profit / 2;

    const finalShare1 = p1Amount + eachShare;
    const finalShare2 = p2Amount + eachShare;

    document.getElementById("totalInvestment").textContent =
        "Total Investment: " + money(totalInvestment);

    document.getElementById("totalReceived").textContent =
        "Total Received: " + money(totalReceived);

    const profitElement = document.getElementById("totalProfit");

    if (profit >= 0) {
        profitElement.textContent = "Total Profit: " + money(profit);
        profitElement.className = "profit";
    } else {
        profitElement.textContent = "Total Loss: " + money(Math.abs(profit));
        profitElement.className = "loss";
    }

    document.getElementById("share1").textContent =
        player1Name + "'s Final Share: " + money(finalShare1);

    document.getElementById("share2").textContent =
        player2Name + "'s Final Share: " + money(finalShare2);

    const settlement = document.getElementById("settlement");

    const difference = finalShare1 - p1Received;

    if (Math.abs(difference) < 0.001) {
        settlement.textContent = "Both players are settled. No payment required.";
    } else if (difference > 0) {
        settlement.textContent =
            player2Name + " should pay " + player1Name + " " + money(difference);
    } else {
        settlement.textContent =
            player1Name + " should pay " + player2Name + " " + money(Math.abs(difference));
    }

    document.getElementById("result").style.display = "block";
}

// RESET AMOUNTS ONLY

function resetCalculator() {

    document.getElementById("player1Amount").value = "";
    document.getElementById("player1Received").value = "";

    document.getElementById("player2Amount").value = "";
    document.getElementById("player2Received").value = "";

    document.getElementById("result").style.display = "none";
}

// CHANGE PLAYER NAMES

function changePlayers() {

    document.getElementById("name1").value = player1Name;
    document.getElementById("name2").value = player2Name;

    document.getElementById("nameError").textContent = "";

    document.getElementById("calculator").style.display = "none";
    document.getElementById("namePopup").style.display = "flex";
}

// ENTER KEY SUPPORT

document.getElementById("name2").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        startCalculator();
    }
});

</script>

</body>
</html>
